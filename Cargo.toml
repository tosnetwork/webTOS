[package]
name = "tos"
version = "0.1.0"
edition = "2021"
authors = ["TOS Project"]
description = "TOS Stage-1: AI-native minimal operating system kernel"

[dependencies]
libm = "0.2"
wasbi = { path = "third_party/wasbi", features = ["spec-test-internals"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "rand_core"] }
rand_core = { version = "0.6", default-features = false }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }

[build-dependencies]
sha2 = "0.10"

[profile.dev]
panic = "abort"
debug-assertions = false  # Avoid UB checks that panic on bare metal (e.g. ptr alignment)

[profile.release]
panic = "abort"
opt-level = "s"  # Size-optimized: avoids opt-level=3 codegen issue that corrupts serial_println string pointers when dispatch.rs match table grows large
