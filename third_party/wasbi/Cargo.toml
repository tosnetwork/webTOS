# Vendored standalone: the upstream workspace members (ecosystem crates,
# spec-test tools, fuzz targets) are not vendored — see PROVENANCE.md.
[workspace]

[package]
name = "wasbi"
version = "0.1.0"
edition = "2021"
description = "A lightweight, no_std WebAssembly interpreter"
license = "MIT"
categories = ["wasm", "no-std", "embedded"]
keywords = ["wasm", "interpreter", "no_std", "webassembly"]
readme = "README.md"
repository = "https://gitlab.com/atos-im/wasbi"
homepage = "https://gitlab.com/atos-im/wasbi"
documentation = "https://docs.rs/wasbi"
rust-version = "1.87"

[features]
default = ["simd", "gc", "exceptions", "threads", "memory64"]
simd = []
gc = []
exceptions = []
threads = []
memory64 = []
spec-test-internals = []

[dependencies]
libm = "0.2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "basic"
harness = false
