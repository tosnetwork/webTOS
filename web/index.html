<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>webTOS — x86-64 in the browser</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 2rem; background: #0b0e14; color: #d6dbe4;
    font: 15px/1.5 system-ui, sans-serif; max-width: 60rem; margin-inline: auto;
  }
  h1 { font-size: 1.2rem; font-weight: 600; }
  h1 span { color: #6aa5ff; }
  #status { color: #8b93a3; min-height: 1.5em; }
  #terminal {
    background: #05070b; border: 1px solid #1d2331; border-radius: 8px;
    padding: 1rem; min-height: 12rem; white-space: pre-wrap; overflow-x: auto;
    font: 13px/1.45 ui-monospace, "Cascadia Mono", monospace; color: #c9e4b4;
  }
  #run {
    background: #1b2c4f; color: #d6dbe4;
    border: 1px solid #2c4a86; border-radius: 6px; padding: .5rem 1.1rem;
    font: inherit; cursor: pointer; margin-block: 1rem;
  }
  #run:disabled { opacity: .5; cursor: default; }
  .meta { color: #8b93a3; font-size: .85rem; }
</style>
</head>
<body>
<h1><span>webTOS</span> — Linux x86-64 ELF running locally in your browser</h1>
<p class="meta">
  A static x86-64 Linux binary is executed instruction-by-instruction by the
  webTOS <code>x64-engine</code> (wasm) inside a Web Worker. No server-side
  compute; the CPU emulation and Linux syscall handling run in this tab.
</p>
<button id="run">Run hello_linux.elf</button>
<div id="status"></div>
<div id="terminal"></div>

<script type="module">
  const statusEl = document.getElementById("status");
  const term = document.getElementById("terminal");
  const button = document.getElementById("run");

  const worker = new Worker(new URL("./worker.js", import.meta.url));
  worker.onmessage = (event) => {
    const msg = event.data;
    if (msg.type === "status") statusEl.textContent = msg.text;
    if (msg.type === "output") term.textContent += msg.text;
    if (msg.type === "error") {
      statusEl.textContent = `error: ${msg.text}`;
      button.disabled = false;
    }
    if (msg.type === "done") {
      statusEl.textContent =
        msg.status === 1
          ? `guest exited with code ${msg.exitCode} after ${msg.icount} instructions`
          : `guest stopped (status ${msg.status}): ${msg.error}`;
      button.disabled = false;
    }
  };

  button.addEventListener("click", async () => {
    button.disabled = true;
    term.textContent = "";
    statusEl.textContent = "fetching guest ELF…";
    const response = await fetch("./hello_linux.elf");
    if (!response.ok) {
      statusEl.textContent = "hello_linux.elf not found — run web/build.sh first";
      button.disabled = false;
      return;
    }
    const elf = await response.arrayBuffer();
    worker.postMessage({ type: "start", elf }, [elf]);
  });
</script>
</body>
</html>
