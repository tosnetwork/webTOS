[package]
name = "atp"
version = "0.1.0"
edition = "2021"
description = "ATOS Package Tool - build, sign, install, and manage .tos packages"

[workspace]

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"

[[bin]]
name = "atp"
path = "src/main.rs"
