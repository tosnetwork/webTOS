[workspace]
resolver = "2"
members = ["x64-engine", "linux-compat", "webtos-web", "bench-control"]

[workspace.dependencies]
icicle-cpu = { path = "../third_party/icicle/icicle-cpu" }
icicle-mem = { path = "../third_party/icicle/icicle-mem" }
pcode = { path = "../third_party/icicle/sleigh/pcode" }
sleigh-runtime = { path = "../third_party/icicle/sleigh/sleigh-runtime" }
sleigh-parse = { path = "../third_party/icicle/sleigh/sleigh-parse" }
sleigh-compile = { path = "../third_party/icicle/sleigh/sleigh-compile" }
target-lexicon = "0.13.3"
tracing = { version = "0.1.40", default-features = false }

# Release speed with overflow checks: catches 32-bit truncation bugs in the
# wasm build without the debug-profile slowdown.
[profile.relcheck]
inherits = "release"
debug-assertions = true
overflow-checks = true

# opt-level 3 miscompiles the vendored SLEIGH interpreter on
# wasm32-unknown-unknown (BusyBox `ls` hangs in an instruction loop that is
# correct at opt-level 2 and in native builds). Pin 2 until the root cause
# is isolated; the relcheck profile below reproduces the working build with
# overflow checks for diagnostics.
[profile.release]
opt-level = 2
