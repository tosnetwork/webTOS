[package]
name = "linux-compat"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Portable Linux x86-64 userspace layer for webTOS: VFS, file descriptors, and syscalls over the x64-engine virtual CPU"

[dependencies]
x64-engine = { path = "../x64-engine" }
icicle-cpu = { workspace = true }
icicle-mem = { workspace = true }
pcode = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# The syscall sweep fills a guest page with hostile struct contents, which is
# a write into guest memory rather than anything the guest ABI offers.
icicle-mem = { workspace = true }
